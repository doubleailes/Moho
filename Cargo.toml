[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/doubleailes/moho"

[workspace.dependencies]
# openusd's API is not stable: always pin an exact `rev`, and bump both crates
# together after re-reading the APIs listed in docs/openusd-notes.md. Moho's
# consumers (Mantle, crust-render) must resolve the same revision: Mantle
# depends on this git source at the same `rev`, crust-render patches its
# crates.io `openusd` to it. Bump in order: Moho, then crust-render, then Mantle.
#
# Pinned to doubleailes/openusd's `feat/mtlx-format-plugin`: its `main`
# (mxpv/openusd's) plus file formats added at run time
# (`sdf::LayerRegistry::with_format`) and the `.mtlx` format
# (`openusd-mtlx`). Back to `main` once both are there.
openusd = { git = "https://github.com/doubleailes/openusd", rev = "a3cde1a48dec16fcbfdd484447acde98a8373351" }
openusd-schemas = { git = "https://github.com/doubleailes/openusd", rev = "a3cde1a48dec16fcbfdd484447acde98a8373351" }
# The `.mtlx` file format, from the same openusd revision.
openusd-mtlx = { git = "https://github.com/doubleailes/openusd", rev = "a3cde1a48dec16fcbfdd484447acde98a8373351" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
