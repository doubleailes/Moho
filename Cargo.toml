[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/doubleailes/moho"

[workspace.dependencies]
# openusd's API is not stable: always pin an exact `rev`, and bump both crates
# together after re-reading the APIs listed in docs/openusd-notes.md. Moho's
# consumers (Mantle, crust-render) must resolve the same revision: Mantle
# depends on this git source at the same `rev`, crust-render patches its
# crates.io `openusd` to it. Bump in order: Moho, then crust-render, then Mantle.
#
# Pinned to mxpv/openusd main (9ba0611).
openusd = { git = "https://github.com/mxpv/openusd", rev = "9ba06114fdb6a43e33f534cc0f8fa4aa1292ee2c" }
openusd-schemas = { git = "https://github.com/mxpv/openusd", rev = "9ba06114fdb6a43e33f534cc0f8fa4aa1292ee2c" }
# The `.mtlx` file format, from the same openusd revision.
openusd-mtlx = { git = "https://github.com/mxpv/openusd", rev = "9ba06114fdb6a43e33f534cc0f8fa4aa1292ee2c" }

# The stack's one wgpu, named only by `moho-render-wgpu` and re-exported by
# it (`moho_render_wgpu::wgpu`): bumping it is bumping Moho in each consumer.
wgpu = "30"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
