[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/doubleailes/moho"

[workspace.dependencies]
# openusd's API is not stable: always pin an exact `rev`, and bump both crates
# together after re-reading the APIs listed in docs/openusd-notes.md. Moho's
# consumers (Mantle, crust-render) must resolve the same revision: Mantle
# depends on this git source at the same `rev`, crust-render patches its
# crates.io `openusd` to it. Bump in order: Moho, then crust-render, then Mantle.
#
# Pinned to doubleailes/openusd's `prim-children-resync`: upstream main at
# 5b86332 plus a fix resyncing a prim whose children or properties a layer
# reorders, which a scene index holding children needs. Back to mxpv/openusd
# once that fix is upstream.
openusd = { git = "https://github.com/doubleailes/openusd", rev = "689bfdec109aef5bca80ebcdc8eef1f5ab4e4db9" }
openusd-schemas = { git = "https://github.com/doubleailes/openusd", rev = "689bfdec109aef5bca80ebcdc8eef1f5ab4e4db9" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
