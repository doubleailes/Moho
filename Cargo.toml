[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/doubleailes/moho"

[workspace.dependencies]
# openusd's API is not stable: always pin an exact `rev`, and bump both crates
# together after re-reading the APIs listed in docs/openusd-notes.md. Moho's
# consumers (Mantle, crust-render) must resolve the same revision: Mantle
# depends on this git source at the same `rev`, crust-render patches its
# crates.io `openusd` to it. Bump in order: Moho, then crust-render, then Mantle.
#
# Pinned to doubleailes/openusd's `perf/clip-time-varying` (upstream main at
# 0a4bb1b plus the clip fixes of mxpv/openusd#175) until that PR merges; then
# back to mxpv/openusd at the merge.
openusd = { git = "https://github.com/doubleailes/openusd", rev = "d7d2a29406871508b6ec3ffe9173a5941b1c6123" }
openusd-schemas = { git = "https://github.com/doubleailes/openusd", rev = "d7d2a29406871508b6ec3ffe9173a5941b1c6123" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
