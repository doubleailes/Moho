[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/doubleailes/moho"

[workspace.dependencies]
# openusd's API is not stable: always pin an exact `rev`, and bump both crates
# together after re-reading the APIs listed in docs/openusd-notes.md. Moho's
# consumers (Mantle, crust-render) must resolve the same revision: Mantle
# depends on this git source at the same `rev`, crust-render patches its
# crates.io `openusd` to it. Bump in order: Moho, then crust-render, then Mantle.
#
# Pinned to doubleailes/openusd's `feat/mtlx-format-plugin` (ca53e71):
# mxpv/openusd main (900ea31) plus file formats added at run time
# (mxpv/openusd#215) and the `.mtlx` format (mxpv/openusd#213). Back to
# mxpv/openusd main once both are merged.
openusd = { git = "https://github.com/doubleailes/openusd", rev = "ca53e71b6a3d7949918e3adb7a9a61e4f4ddd172" }
openusd-schemas = { git = "https://github.com/doubleailes/openusd", rev = "ca53e71b6a3d7949918e3adb7a9a61e4f4ddd172" }
# The `.mtlx` file format, from the same openusd revision.
openusd-mtlx = { git = "https://github.com/doubleailes/openusd", rev = "ca53e71b6a3d7949918e3adb7a9a61e4f4ddd172" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
